<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
        }

        h1 { margin-bottom: 10px; }

        /* --- TOP SECTION: STATUS GRID --- */
        .status-panel {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 0 auto 30px auto; /* Centers the panel and adds bottom margin */
            max-width: 1200px;
        }
        
        .stats {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .stats span { font-weight: bold; color: #00ff00; }

        .grid {
            display: grid;
            /* This forces exactly 10 items per row */
            grid-template-columns: repeat(10, 1fr); 
            gap: 10px;
            padding: 10px;
        }

        /* Mobile responsive: On small screens, switch to 5 per row */
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(5, 1fr); }
        }

        .slot {
            aspect-ratio: 1.5; /* Makes them slightly rectangular */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s;
            cursor: default;
        }

        .slot:hover { transform: scale(1.05); }

        .free { 
            background-color: #28a745; 
            color: white; 
            border: 2px solid #20c997;
        }
        .busy { 
            background-color: #dc3545; 
            color: white; 
            border: 2px solid #ff6b6b;
        }

        /* --- BOTTOM SECTION: VIDEO --- */
        .video-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .video-box {
            border: 4px solid #444;
            border-radius: 8px;
            overflow: hidden;
            max-width: 900px; /* Limits video size so it doesn't fill whole screen */
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .video-box img { 
            width: 100%; 
            display: block; 
        }

    </style>
</head>
<body>

    <h1>Smart Parking System</h1>

    <div class="status-panel">
        <div class="stats">
            Occupancy: <span id="occupancy-text">Loading...</span>
        </div>
        <div class="grid" id="slot-grid">
            </div>
    </div>

    <div class="video-container">
        <div class="video-box">
            <img src="{{ url_for('video_feed') }}" alt="Live Parking Feed">
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    // Update Text
                    const textElement = document.getElementById('occupancy-text');
                    textElement.innerText = `${data.occupied} / ${data.total}`;
                    
                    // Change color of text if full
                    if(data.occupied === data.total) {
                        textElement.style.color = 'red';
                    } else {
                        textElement.style.color = '#00ff00';
                    }
                    
                    // Update Grid
                    const grid = document.getElementById('slot-grid');
                    grid.innerHTML = ''; // Clear current grid

                    data.slots.forEach((status, index) => {
                        const div = document.createElement('div');
                        div.className = status === 1 ? 'slot busy' : 'slot free';
                        div.innerText = index + 1;
                        div.title = status === 1 ? "Occupied" : "Available";
                        grid.appendChild(div);
                    });
                })
                .catch(err => console.error("Error fetching status:", err));
        }

        // Refresh status every 1 second
        setInterval(updateStatus, 1000);
        updateStatus(); // Run immediately on load
    </script>
</body>
</html>
